<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Applications</title>

	<style>
	    body {
	        font-family: 'Segoe UI', sans-serif;
	        background: #0f172a; /* dark black-blue */
	        margin: 0;
	        color: white;
	    }

	    h2 {
	        text-align: center;
	        margin-top: 20px;
	        color: #e2e8f0; /* soft white */
	    }

	    table {
	        width: 80%;
	        margin: auto;
	        border-collapse: collapse;
	        margin-top: 20px;
	        background: #111827; /* deep black */
	        border-radius: 10px;
	        overflow: hidden;
	        color: white;
	    }

	    th {
	        background: #1d4ed8; /* blue */
	        color: white;
	        padding: 12px;
	    }

	    td {
	        padding: 10px;
	        text-align: center;
	    }

	    tr:nth-child(even) {
	        background: #1f2933; /* dark gray-blue */
	    }

	    button {
	        padding: 6px 12px;
	        border: none;
	        border-radius: 10px;
	        cursor: pointer;
	        background: #2563eb; /* blue */
	        color: white;
	    }

	    button:hover {
	        background: #1e40af; /* darker blue */
	    }
	</style>
</head>

<body>
	<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#2a5298; color:white;">
	    <span style="font-size:18px;">Job Portal</span>
	    <a href="/" style="color:white; text-decoration:none; font-weight:bold;">Home</a>
	</div>
<h2>Applications</h2>

<table border="1">
<tr>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Job ID</th>
    <th>Status</th>
    <th>Action</th>
</tr>

<tr th:each="a : ${apps}">
    <td th:text="${a.firstName + ' ' + a.lastName}"></td>
    <td th:text="${a.email}"></td>
    <td th:text="${a.phone}"></td>
    <td th:text="${a.jobId}"></td>

    <td th:style="${a.status == 'SHORTLISTED'} ? 'color:green' : 
                  (${a.status == 'REJECTED'} ? 'color:red' : 'color:black')"
        th:text="${a.status}">
    </td>

    <td>
        <a th:href="@{'/admin/status/' + ${a.id} + '/SHORTLISTED'}">
            <button style="background:green; color:white;">Shortlist</button>
        </a>

        <a th:href="@{'/admin/status/' + ${a.id} + '/REJECTED'}">
            <button style="background:red; color:white;">Reject</button>
        </a>
    </td>
</tr>

</table>

</body>
</html>
