<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Apply Job</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
    margin: 0;
}

h2 {
    text-align: center;
    margin-top: 20px;
}

.container {
    width: 80%;
    margin: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

th {
    background: #2a5298;
    color: white;
    padding: 12px;
}

td {
    padding: 10px;
    text-align: center;
}

tr:nth-child(even) {
    background: #f2f2f2;
}

button {
    padding: 8px 15px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: #2a5298;
    color: white;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

input, select {
    padding: 10px;
    margin: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
}

form {
    text-align: center;
}
</style>
</head>

<body>
	<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#2a5298; color:white;">
	    <span style="font-size:18px;">Job Portal</span>
	    <a href="/" style="color:white; text-decoration:none; font-weight:bold;">Home</a>
	</div>

<div class="container">

<h2>Apply for Job</h2>

<h3>Job Details</h3>

<p><b>Company:</b> <span th:text="${job.companyName}"></span></p>
<p><b>Title:</b> <span th:text="${job.title}"></span></p>
<p><b>Description:</b> <span th:text="${job.description}"></span></p>
<p><b>Skills:</b> <span th:text="${job.skills}"></span></p>
<p><b>Location:</b> <span th:text="${job.location}"></span></p>
<p><b>Salary:</b> <span th:text="${job.salary}"></span></p>

<hr>

<form action="/user/apply" method="post" enctype="multipart/form-data">

<input type="hidden" name="jobId" th:value="${job.id}">

<input name="firstName" placeholder="First Name" required>
<input name="lastName" placeholder="Last Name" required>
<input name="email" placeholder="Email" required>
<input name="phone" placeholder="Phone" required>

<input type="file" name="resume" required>

<br>
<button type="submit">Submit</button>

</form>

</div>

</body>
</html>
