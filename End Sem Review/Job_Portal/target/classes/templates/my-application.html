<!DOCTYPE html>
<html>
<head>
<title>My Applications</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
    margin: 0;
}

h2 {
    text-align: center;
    margin-top: 20px;
}

.container {
    width: 80%;
    margin: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

th {
    background: #2a5298;
    color: white;
    padding: 12px;
}

td {
    padding: 10px;
    text-align: center;
}

tr:nth-child(even) {
    background: #f2f2f2;
}

button {
    padding: 8px 15px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: #2a5298;
    color: white;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

input, select {
    padding: 10px;
    margin: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
}

form {
    text-align: center;
}
</style>

</head>

<body>
	<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#2a5298; color:white;">
	    <span style="font-size:18px;">Job Portal</span>
	    <a href="/" style="color:white; text-decoration:none; font-weight:bold;">Home</a>
	</div>

<h2 style="text-align:center;">My Applications</h2>

<!-- ✅ FIX: Show message if no applications -->
<div th:if="${#lists.isEmpty(apps)}" style="text-align:center;">
    <p>No applications found for this email.</p>
</div>

<!-- ✅ FIX: Show table only if data exists -->
<table border="1" th:if="${!#lists.isEmpty(apps)}">
<tr>
<th>Job ID</th>
<th>Status</th>
</tr>

<tr th:each="a : ${apps}">
<td th:text="${a.jobId}"></td>

<td th:text="${a.status}"
    th:class="'status ' + 
    (${a.status}=='SHORTLISTED'?'shortlisted':
     (${a.status}=='REJECTED'?'rejected':'applied'))">
</td>

</tr>

</table>

</body>
</html>
