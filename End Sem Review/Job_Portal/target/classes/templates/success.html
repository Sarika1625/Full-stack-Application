<!DOCTYPE html>
<html>
<head>
<title>Success</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    text-align: center;
    padding-top: 100px;
    color: white;
}

.box {
    background: white;
    color: black;
    padding: 40px;
    border-radius: 15px;
    width: 400px;
    margin: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: fadeIn 1s ease;
}

h2 {
    color: green;
}

a {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 20px;
    background: #007bff;
    color: white;
    border-radius: 20px;
    text-decoration: none;
}

a:hover {
    background: #0056b3;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1;}
}
</style>

</head>
<body>
	<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#2a5298; color:white;">
	    <span style="font-size:18px;">Job Portal</span>
	    <a href="/" style="color:white; text-decoration:none; font-weight:bold;">Home</a>
	</div>
<div class="box">
    <h2>✅ Application Submitted Successfully!</h2>
    <p>Your application has been received.</p>

    <a href="/user">Back to Jobs</a>
</div>

</body>
</html>
